name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build windows-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/usageguard-desktop/ui/package-lock.json

      - name: Install desktop UI dependencies
        run: npm ci --prefix crates/usageguard-desktop/ui

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build Windows release artifacts
        shell: pwsh
        run: |
          cargo build --release -p usageguard-cli
          Push-Location crates/usageguard-desktop
          cargo tauri build --config tauri.windows.conf.json
          Pop-Location
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/usageguard.exe dist/
          Compress-Archive -Path dist/usageguard.exe -DestinationPath dist/usage-guard-windows-cli-x64.zip -Force
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/
          Copy-Item target/release/bundle/msi/*.msi dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: usage-guard-windows-x64
          path: |
            dist/usage-guard-windows-cli-x64.zip
            dist/*-setup.exe
            dist/*.msi

  build-linux:
    name: Build linux-x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/usageguard-desktop/ui/package-lock.json

      - name: Install desktop UI dependencies
        run: npm ci --prefix crates/usageguard-desktop/ui

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      - name: Build Linux bundles
        working-directory: crates/usageguard-desktop
        run: cargo tauri build --config tauri.linux.conf.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usage-guard-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact files
        run: |
          mkdir -p release-assets
          find dist -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} release-assets/ \;
          ls -lah release-assets

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS
